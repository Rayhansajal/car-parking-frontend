<div class="auth-container">
  <div class="auth-card">
    <h2>Welcome to SmartPark</h2>
    <p class="subtitle">Manage parking smarter</p>

    <!-- Tabs -->
    <div class="tabs">
      <button [class.active]="activeTab === 'login'" (click)="switchTab('login')">
        Login
      </button>
      <button [class.active]="activeTab === 'register'" (click)="switchTab('register')">
        Register
      </button>
    </div>

    <!-- Login Form -->
    <form *ngIf="activeTab === 'login'" (ngSubmit)="onLogin()">
      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="loginData.email" name="email" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" [(ngModel)]="loginData.password" name="password" required>
      </div>
      <button type="submit" [disabled]="loading" class="auth-btn">
        {{ loading ? 'Logging in...' : 'Login' }}
      </button>
    </form>

    <!-- Register Form -->
    <form *ngIf="activeTab === 'register'" (ngSubmit)="onRegister()">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" [(ngModel)]="registerData.name" name="name" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="registerData.email" name="email" required>
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input type="tel" [(ngModel)]="registerData.phone" name="phone">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" [(ngModel)]="registerData.password" name="password" required>
      </div>
      <div class="form-group">
        <label>Register As</label>
        <select [(ngModel)]="registerData.role" name="role">
          <option value="DRIVER">Driver</option>
          <option value="OPERATOR">Operator</option>
        </select>
      </div>
      <button type="submit" [disabled]="loading" class="auth-btn">
        {{ loading ? 'Creating Account...' : 'Register' }}
      </button>
    </form>

    <div *ngIf="error" class="error-message">{{ error }}</div>
    <div *ngIf="success" class="success-message">{{ success }}</div>

  </div>
</div>
