<div class="parking-lots-page">
  
  <!-- Page Header -->
  <div class="page-header">
    <div class="header-content">
      <h1>Parking Lots</h1>
      <p class="subtitle">Manage all your parking locations</p>
    </div>
    <button class="btn-primary" (click)="createNewLot()">
      <span>+</span> New Parking Lot
    </button>
  </div>

  <!-- Search Bar -->
  <div class="search-container">
    <div class="search-bar">
      <span class="search-icon">🔍</span>
      <input 
        type="text" 
        [(ngModel)]="searchTerm" 
        (keyup.enter)="onSearch()"
        placeholder="Search by name, city or address...">
    </div>
  </div>

  <!-- Loading -->
  <div *ngIf="loading" class="loading-state">
    <div class="spinner"></div>
    <p>Loading parking lots...</p>
  </div>

  <!-- Lots Grid -->
  <div class="lots-grid" *ngIf="!loading">
    <div class="lot-card" *ngFor="let lot of lots">
      <div class="lot-header">
        <h3>{{ lot.name }}</h3>
        <span class="status-badge" 
              [class.active]="lot.enabled" 
              [class.inactive]="!lot.enabled">
          {{ lot.enabled ? 'Active' : 'Inactive' }}
        </span>
      </div>
      
      <div class="lot-body">
        <p class="address">
          📍 {{ lot.address }}, {{ lot.city }}
        </p>
        <p class="rate">
          <strong>Hourly Rate:</strong> ৳{{ lot.hourlyRate }}
        </p>
      </div>

      <div class="lot-footer">
        <button class="btn-edit" (click)="editLot(lot.id)">
          Edit
        </button>
        <button class="btn-delete" (click)="deleteLot(lot.id)">
          Delete
        </button>
      </div>
    </div>
  </div>

  <!-- Empty State -->
  <div *ngIf="lots.length === 0 && !loading" class="empty-state">
    <div class="empty-icon">🅿️</div>
    <h3>No parking lots found</h3>
    <p>Try adjusting your search or add a new parking lot.</p>
    <button class="btn-primary" (click)="createNewLot()">
      + Add New Parking Lot
    </button>
  </div>
</div>
